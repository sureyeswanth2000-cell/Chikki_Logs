name: Deploy Firebase Hosting (prod)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: firebase-production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Build static site
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: npm run build

      - name: Prepare Firebase Hosting base path
        run: |
          mkdir -p out/Chikki_Logs
          find out -mindepth 1 -maxdepth 1 ! -name Chikki_Logs -exec cp -R {} out/Chikki_Logs/ \;

      - name: Prepare Functions environment
        env:
          AADHAAR_VAULT_ENCRYPTION_KEY: ${{ secrets.AADHAAR_VAULT_ENCRYPTION_KEY }}
        run: |
          test -n "$AADHAAR_VAULT_ENCRYPTION_KEY"
          printf "AADHAAR_VAULT_ENCRYPTION_KEY=%s\n" "$AADHAAR_VAULT_ENCRYPTION_KEY" > functions/.env

      - name: Deploy Firebase production
        run: npx firebase-tools deploy --only hosting,functions,firestore:rules --project chikki-logs-72607 --token "${{ secrets.FIREBASE_TOKEN }}"
