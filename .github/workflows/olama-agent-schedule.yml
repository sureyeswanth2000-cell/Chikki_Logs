name: Colab Agent Scheduled Runner

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      session_prompt:
        description: 'Optional prompt text for the Colab agent session'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run-colab-agent:
    name: Run Colab Agent and Apply Changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Make runner executable
        run: chmod +x .github/scripts/olama-agent-runner.sh

      - name: Run Colab agent
        env:
          COLAB_API_URL: ${{ secrets.COLAB_API_URL }}
          COLAB_API_TOKEN: ${{ secrets.COLAB_API_TOKEN }}
          COLAB_AGENT_NAME: ${{ secrets.COLAB_AGENT_NAME }}
          SESSION_PROMPT: ${{ github.event.inputs.session_prompt }}
          COMMIT_BRANCH: ${{ secrets.COLAB_COMMIT_BRANCH }}
          COMMIT_MESSAGE: ${{ secrets.COLAB_COMMIT_MESSAGE }}
          COLAB_MAX_ITERATIONS: ${{ secrets.COLAB_MAX_ITERATIONS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/olama-agent-runner.sh

      - name: Upload agent artifacts
        uses: actions/upload-artifact@v4
        with:
          name: colab-agent-artifacts
          path: |
            colab-session-link.txt
            colab-agent-response.json
            colab-agent-log.txt
